[package]
name = "v888-booleen"
default-run = "v888-booleen"
version = "0.1.0"
edition = "2021"
publish = false
description = "V888 BOOLEEN: recherche sur une representation booleenne du connectome BANC V888."

[lib]
name = "v888_booleen"
path = "src/lib.rs"

[[bin]]
name = "v888-booleen"
path = "src/main.rs"

# Grid/determinism tests are CPU-heavy; optimise test builds so the
# RemoteOps offline qualification stays well inside its time budget.
# overflow-checks and debug-assertions stay on (inherited from dev).
[profile.test]
opt-level = 2

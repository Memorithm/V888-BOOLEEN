name: V888 BOOLEEN Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v888-rust-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    # Safe shared GitHub runner: no self-hosted privileges, no access to Dell
    # connectome files, no saved model checkpoints and no repository secrets.
    if: >-
      github.repository == 'Memorithm/V888-BOOLEEN' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == 'Memorithm/V888-BOOLEEN')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_NET_OFFLINE: "true"
      RUSTUP_TOOLCHAIN: "1.89.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install official pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.89.0 --profile minimal --component rustfmt --component clippy --no-self-update
          test "$(rustc --version | awk '{print $2}')" = 1.89.0
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --offline --all-targets -- -D warnings
      - name: Tests
        run: cargo test --offline
      - name: Smoke
        run: cargo run --offline -- info

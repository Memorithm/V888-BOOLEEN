name: V888 BOOLEEN Rust CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    # RemoteOps: qualified nonprivileged Memorithm CI pool, never the
    # privileged remoteops/dell-t430 control runner.
    if: >-
      github.repository == 'Memorithm/V888-BOOLEEN' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == 'Memorithm/V888-BOOLEEN')
    runs-on: [self-hosted, Linux, X64, memorithm-ci, dell-general, ci-light, trusted-main]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Use host-managed isolated Rust 1.89 (no root, no network install)
        shell: bash
        run: |
          set -euo pipefail
          bin=/opt/memorithm-ci-toolchains/rust-1.89.0/bin
          test -x "$bin/rustc"
          test -x "$bin/cargo"
          test -x "$bin/cargo-clippy"
          test -x "$bin/rustfmt"
          test "$("$bin/rustc" --version | awk '{print $2}')" = 1.89.0
          printf '%s\n' "$bin" >> "$GITHUB_PATH"
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test
      - name: Smoke
        run: cargo run -- info
